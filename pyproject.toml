# Dependencies are managed with uv: `uv sync` installs them from uv.lock (the dev group too).
[project]
name = "PzzCompareAPI"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "geopandas==1.1.3",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "requests==2.32.5",
    "urllib3==2.6.3",
    "tqdm==4.67.3",
    "openpyxl==3.1.5",
    "nltk==3.9.4",
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "sqlalchemy==2.0.49",
    "psycopg[binary]==3.3.3",
    "celery==5.6.3",
    "redis==7.4.0",
    "pydantic-settings==2.14.0",
    "pydantic==2.13.3",
    "idu-config==1.0.3",
    "pymorphy3==2.0.6",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "python-multipart==0.0.26",
    "prometheus-client==0.24.1",
    "minio==7.2.7",
    "httpx==0.28.1",
    "aiohttp>=3.14,<4",
    "idu-service-auth @ https://github.com/IDUclub/idu-service-auth/archive/1b8a418d9b1ab702860eb7289a3b75244666a8d8.tar.gz",
    "pyarrow==18.1.0",
    "fastmcp==3.3.1",
    "alembic==1.16.1",
    "python-jose[cryptography]==3.3.0",
    "cachetools==5.5.2",
    "tenacity==9.0.0",
    "loguru==0.7.3",
    "sse-starlette==2.3.6",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "v$version"
version_files = [
    "service/__version__.py:VERSION",
]
update_changelog_on_bump = true
major_version_zero = true

[tool.black]
line-length = 88
target-version = ["py310", "py311"]
# pipeline_modules/ is vendored third-party code — keep it as upstream ships it.
extend-exclude = '''
/(
  pipeline_modules
)/
'''
