# Dependencies are pinned in requirements.txt (pip); this file holds the version and tool config.
[project]
name = "PzzCompareAPI"
version = "0.0.0"
requires-python = ">=3.11"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "v$version"
version_files = [
    "service/__version__.py:VERSION",
]
update_changelog_on_bump = true
major_version_zero = true

[tool.black]
line-length = 88
target-version = ["py310", "py311"]
# pipeline_modules/ is vendored third-party code — keep it as upstream ships it.
extend-exclude = '''
/(
  pipeline_modules
)/
'''
