name: Tests

on:
  pull_request:
    branches: [dev, main]

# Cancel stale runs when a new commit is pushed to the PR.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The settings the service needs to import (see tests/conftest.py and ci-dev.yml).
env:
  APP_ENV: development
  URBAN_API_BASE_URL: http://localhost:9999
  FILESERVER_ENDPOINT: localhost:9000
  FILESERVER_ACCESS_KEY: test
  FILESERVER_SECRET_KEY: test
  FILESERVER_BUCKET_NAME: test
  EMBED_MAX_PARALLEL_REQUESTS: 1
  VLLM_MAX_PARALLEL_REQUESTS: 1
  LLM_API_MODE: chat
  LLM_TEMPERATURE: 0
  LLM_NUM_CTX: 2048
  LLM_NUM_PREDICT: 256
  LLM_THINK: false
  VLLM_ENABLE_THINK_PARAM: false
  VLLM_THINK_FIELD_NAME: think
  NOT_ALLOWED_LLM_RERANK_NUM_CTX: 2048
  NOT_ALLOWED_LLM_RERANK_NUM_PREDICT: 256
  NOT_ALLOWED_LLM_RERANK_THINK: false

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest==9.1.1

      - name: Run unit tests
        run: |
          cp .env.example .env.development
          python -m pytest -m "not integration" --verbose tests

  integration:
    name: Integration
    uses: ./.github/workflows/integration.yml

  format:
    name: Format (black)
    needs: [unit-tests, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push auto-format fixes back to the PR branch
      pull-requests: write    # leave a comment on the PR
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR branch itself (not the detached merge ref) so we can push.
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      # First check. On mismatches pre-commit rewrites the files and returns a
      # non-zero code. Don't fail the job here — handle the result below.
      - name: Check formatting
        id: check
        run: |
          if pre-commit run --all-files --show-diff-on-failure; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      # If the first check found mismatches, commit the auto-fixes to the PR branch.
      - name: Commit auto-format
        if: steps.check.outputs.clean == 'false'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit (mismatch is not auto-fixable)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format with black [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Comment on PR
        if: steps.check.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "🎨 Code did not satisfy black — applied auto-formatting and pushed the fixes to the branch. Re-running the check."

      # Second check. If mismatches remain after auto-formatting, fail the job → the PR is blocked.
      - name: Re-check formatting
        if: steps.check.outputs.clean == 'false'
        run: pre-commit run --all-files --show-diff-on-failure
